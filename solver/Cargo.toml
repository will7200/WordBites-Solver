[package]
name = "solver"
categories = ["wasm"]
description = "Word Bites Solver"
version = "0.2.0"
authors = ["William Flores <will7207@gmail.com>"]
edition = "2021"
readme = "./README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/will7200/WordBites-Solver"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "build-filter"
path = "src/bin/build_filter.rs"

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
itertools = "0.14"
# The bloom filter .dat files in /public are bincode-1 serialized with this exact
# version; changing either crate would invalidate them.
probabilistic-collections = { version = "=0.7.0", features = ["serde"] }
bincode = "1.3"
base64 = "0.22"
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
