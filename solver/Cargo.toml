[package]
name = "solver"
categories = ["wasm"]
description = "Word Bites Solver"
version = "0.3.0"
authors = ["William Flores <will7207@gmail.com>"]
edition = "2021"
readme = "./README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/will7200/WordBites-Solver"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "build-dict"
path = "src/bin/build_dict.rs"

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
fst = "0.4"
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
